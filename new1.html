<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Online</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: #f4f4f4;
      }
      header {
        background: #2196f3;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .container {
        display: flex;
        gap: 20px;
        padding: 20px;
      }
      .products {
        flex: 3;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
      }
      .card img {
        width: 100%;
        height: 100px;
        object-fit: cover;
      }
      .card h3 {
        padding: 10px;
      }
      .price {
        color: red;
        font-weight: bold;
        padding: 0 10px;
      }
      .card button {
        width: 100%;
        padding: 12px;
        border: none;
        background: #28a745;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }
      .card button:hover {
        background: #1f7d35;
      }
      .cart {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 10px;
        height: fit-content;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
      }
      .cart h2 {
        margin-bottom: 15px;
      }
      .cart-item {
        margin-bottom: 10px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
      }
      .cart button {
        padding: 3px 8px;
      }
      .total {
        margin-top: 20px;
        font-size: 20px;
        color: red;
        font-weight: bold;
      }
      @media (max-width: 800px) {
        .container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛒 SHOP ONLINE</h1>
    </header>
    <div class="container">
      <div class="products" id="products"></div>
      <div class="cart">
        <h2>Giỏ Hàng</h2>
        <div id="cartItems"></div>
        <div class="total">Tổng: <span id="total">0</span>VND</div>
      </div>
    </div>
    <script>
          const products = [
            {
              id: 1,
              name: "iPhone 16",
              price: 25000000,
              image: "https://picsum.photos/300?1",
            },
            {
              id: 2,
              name: "Laptop Gaming",
              price: 18000000,
              image: "https://picsum.photos/300?2",
            },
                    {
              id: 3,
              name: "Tai nghe Bluetooth",
              price: 12000000,
              image: "https://picsum.photos/300?3",
            },
                    {
              id: 4,
              name: "Đồng hồ thông minh",
              price: 35000000,
              image: "https://picsum.photos/300?4",
            }
          ];
          const cart=[];
          const productsDiv=document.getElementById("products");
      products.forEach(p=>{
        productsDiv.innerHTML+=`
        <div class="card">
      })
    </script>
  </body>
</html>
